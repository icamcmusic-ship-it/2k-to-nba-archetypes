name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the engine test suite
        run: npm test

  archetypes-in-sync:
    # docs/archetypes.js is generated from the workbook and committed. Nothing
    # kept the two in sync before; a stale data file is invisible until someone
    # notices the app matching against builds the workbook no longer contains.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Regenerate from the workbook
        run: python3 tools/extract_archetypes.py data/2K_to_BBGM_Archetypes.xlsx
      - name: Fail if the committed file differs
        run: |
          if ! git diff --exit-code -- docs/archetypes.js; then
            echo "::error::docs/archetypes.js is out of date. Run: python3 tools/extract_archetypes.py data/2K_to_BBGM_Archetypes.xlsx"
            exit 1
          fi

  sample-roster-in-sync:
    # docs/PlayerRatings_sample.csv is a copy of data/PlayerRatings_sample.csv
    # served from the Pages folder; drift between them makes the in-app sample
    # button disagree with the repo's own data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: diff data/PlayerRatings_sample.csv docs/PlayerRatings_sample.csv
